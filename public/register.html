<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap"><link rel="stylesheet" href="/css/styles.css"><title>Apex F1 · Registro</title></head><body>
<header class="top"><a class="brand" href="/">APEX<span>F1</span></a>
<nav aria-label="Principal"><a href="/">Inicio</a><a href="/standings.html">Clasificación</a><a href="/register.html" aria-current="page">Registro</a></nav></header>
<div class="kerb" aria-hidden="true"></div>
<main>
<h1>Crea tu cuenta</h1>
<p class="lead">Elige tu escudería favorita y la verás resaltada en las tablas.</p>
<form id="regForm" novalidate>
<div class="field"><label for="name">Nombre</label><input id="name" name="name" type="text" autocomplete="name" maxlength="50" aria-describedby="err-name" required><p class="err" id="err-name"></p></div>
<div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" maxlength="100" aria-describedby="err-email" required><p class="err" id="err-email"></p></div>
<div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="64" aria-describedby="err-password rules" required>
<ul class="rules" id="rules"><li id="rule-len">Mínimo 8 caracteres</li><li id="rule-num">Al menos un número</li><li id="rule-up">Al menos una mayúscula</li></ul><p class="err" id="err-password"></p></div>
<div class="field"><label for="confirm">Confirmar contraseña</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="64" aria-describedby="err-confirm" required><p class="err" id="err-confirm"></p></div>
<div class="field"><label for="team">Escudería favorita</label><select id="team" name="team" aria-describedby="err-team" required>
<option value="">Selecciona una escudería</option>
<option>Red Bull Racing</option><option>Ferrari</option><option>Mercedes</option><option>McLaren</option><option>Aston Martin</option>
<option>Alpine</option><option>Williams</option><option>AlphaTauri</option><option>Haas</option><option>Alfa Romeo</option></select><p class="err" id="err-team"></p></div>
<button class="btn" type="submit">Crear cuenta</button>
<p class="status" id="status" role="status" aria-live="polite"></p>
</form>
</main>
<footer>Apex F1 · Proyecto académico, Unidad 3 · Datos vía API-Sports (consumidos desde el servidor)</footer>
<script src="/js/common.js"></script><script src="/js/register.js"></script></body></html>
